<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProfControl - 三层流水线监控面板</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
    font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
    background: #0a141c;
    color: #cdd6e0;
    min-height: 100vh;
    padding: 16px;
}
.header {
    text-align: center;
    padding: 12px 0 18px;
    border-bottom: 1px solid #1e3a4d;
    margin-bottom: 16px;
}
.header h1 { font-size: 20px; color: #4fc3f7; letter-spacing: 2px; }
.header p { font-size: 12px; color: #6a8fa0; margin-top: 4px; }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 1200px; margin: 0 auto; }
.card {
    background: #15232e;
    border: 1px solid #1e3a4d;
    border-radius: 8px;
    padding: 14px;
}
.card-title {
    font-size: 13px;
    font-weight: 600;
    color: #8bbccc;
    letter-spacing: 1px;
    margin-bottom: 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid #1e3a4d;
}
.full-width { grid-column: 1 / -1; }

/* ===== 1. 模式切换 ===== */
.mode-row { display: flex; gap: 10px; align-items: center; }
.btn {
    padding: 8px 20px;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 1px;
}
.btn-on  { background: #2e7d32; color: #fff; }
.btn-on:hover { background: #388e3c; }
.btn-on.active { box-shadow: 0 0 14px #4caf50; }
.btn-off { background: #c62828; color: #fff; }
.btn-off:hover { background: #d32f2f; }
.btn-off.active { box-shadow: 0 0 14px #f44336; }
.mode-indicator {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 700;
    margin-left: 8px;
}
.mode-auto { background: #1b5e20; color: #a5d6a7; }
.mode-manual { background: #e65100; color: #ffe0b2; }

/* ===== 2. AGV 状态面板 ===== */
.agv-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
}
.agv-item {
    padding: 6px 8px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    text-align: center;
    border: 1px solid #1e3a4d;
    background: #1a2d38;
    transition: all 0.2s;
}
.agv-item .dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 4px;
    vertical-align: middle;
}
.dot-idle   { background: #66bb6a; box-shadow: 0 0 6px #66bb6a; }
.dot-busy   { background: #ffa726; box-shadow: 0 0 6px #ffa726; }
.dot-manual { background: #42a5f5; box-shadow: 0 0 6px #42a5f5; }
.agv-idle   { border-color: #2e7d32; background: #1b3a20; }
.agv-busy   { border-color: #e65100; background: #3a2010; }
.agv-manual { border-color: #1565c0; background: #102a40; }

/* ===== 3. 楼层加工状态 ===== */
.floor-layout { display: flex; gap: 10px; min-height: 200px; }
.floor-tabs {
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 48px;
}
.floor-tab {
    padding: 12px 8px;
    border: 1px solid #1e3a4d;
    border-radius: 6px;
    background: #1a2d38;
    color: #6a8fa0;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
}
.floor-tab:hover { border-color: #4fc3f7; color: #cdd6e0; }
.floor-tab.active { background: #0d47a1; border-color: #42a5f5; color: #fff; }

.floor-content {
    flex: 1;
    background: #0a141c;
    border: 1px solid #1e3a4d;
    border-radius: 6px;
    padding: 8px;
    overflow-y: auto;
    max-height: 320px;
}
.floor-stats {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
}
.machine-badge {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 3px 8px;
    border-radius: 4px;
    font-size: 11px;
    background: #1a2d38;
    border: 1px solid #1e3a4d;
}
.machine-badge .qty {
    font-weight: 700;
    color: #4fc3f7;
    min-width: 14px;
    text-align: center;
}
.machine-badge .label {
    color: #7a9aaa;
}
.machine-badge.type-产生站 { border-left: 3px solid #ab47bc; }
.machine-badge.type-粗加工站 { border-left: 3px solid #ff7043; }
.machine-badge.type-精加工站 { border-left: 3px solid #42a5f5; }
.machine-badge.type-组装站 { border-left: 3px solid #66bb6a; }
.machine-badge.type-输出站 { border-left: 3px solid #ffee58; }

/* ===== 4. 电梯状态 ===== */
.elevator-row {
    display: flex;
    gap: 16px;
    justify-content: center;
}
.elevator-box {
    flex: 1;
    max-width: 260px;
    background: #0a141c;
    border: 1px solid #1e3a4d;
    border-radius: 8px;
    padding: 10px;
    text-align: center;
}
.elevator-box .title {
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 8px;
}
.elevator-box .title.left { color: #4fc3f7; }
.elevator-box .title.right { color: #ffa726; }
.elevator-floors {
    display: flex;
    flex-direction: column;
    gap: 4px;
}
.elev-floor {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 12px;
    background: #1a2d38;
    border: 1px solid #1e3a4d;
}
.elev-floor .floor-tag {
    font-weight: 700;
    color: #6a8fa0;
}
.elev-floor .floor-status {
    display: flex;
    align-items: center;
    gap: 6px;
}
.elev-occupied {
    color: #ffa726;
    font-weight: 600;
}
.elev-free {
    color: #66bb6a;
}
.elev-agv-names {
    font-size: 10px;
    color: #7a9aaa;
}

/* ===== 5. 日志 ===== */
.log-area {
    background: #0a141c;
    border: 1px solid #1e3a4d;
    border-radius: 6px;
    height: 150px;
    overflow-y: auto;
    padding: 8px;
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 11px;
    line-height: 1.5;
}
.log-area .log-line { padding: 1px 0; }
.log-area .log-ok   { color: #66bb6a; }
.log-area .log-info { color: #4fc3f7; }
.log-area .log-err  { color: #ef5350; }
.log-area .log-warn { color: #ffa726; }

/* ===== 6. 任务下达 ===== */
.task-form { background:#0a141c; border-radius:6px; padding:10px; }
.task-row { display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end; }
.task-field { display:flex; flex-direction:column; gap:3px; min-width:80px; }
.task-field label { font-size:11px; color:#8bbccc; font-weight:600; }
.task-field select, .task-field input {
    background:#1a2d38; border:1px solid #1e3a4d; border-radius:4px;
    padding:6px 8px; color:#cdd6e0; font-size:12px; outline:none;
}
.task-field select:focus, .task-field input:focus { border-color:#4fc3f7; }
.task-btn-field { min-width:100px; }
.btn-send {
    background:#0d47a1; color:#fff; padding:8px 18px; border:none;
    border-radius:6px; font-size:13px; font-weight:700; cursor:pointer;
    transition:all 0.2s; letter-spacing:1px;
}
.btn-send:hover { background:#1565c0; box-shadow:0 0 10px #42a5f5; }
.task-hint { margin-top:6px; font-size:11px; color:#6a8fa0; }

/* responsive */
@media (max-width: 800px) {
    .grid { grid-template-columns: 1fr; }
    .floor-layout { flex-direction: column; }
    .floor-tabs { flex-direction: row; min-width: auto; }
}
</style>
</head>
<body>

<div class="header">
    <h1>🏭 ProfControl 三层流水线监控</h1>
    <p>3F 产生+粗加工 → 2F 精加工 → 1F 组装 → 输出</p>
</div>

<div class="grid">

    <!-- ========== 板块1: 模式切换 ========== -->
    <div class="card">
        <div class="card-title">🔘 模式控制</div>
        <div class="mode-row">
            <button class="btn btn-on" id="btnManualOn" onclick="sendCmd('manual on')">🖐 手动</button>
            <button class="btn btn-off" id="btnManualOff" onclick="sendCmd('manual off')">🔄 自动</button>
            <span class="mode-indicator mode-auto" id="modeIndicator">自动</span>
        </div>
    </div>

    <!-- ========== 板块2: AGV状态 ========== -->
    <div class="card">
        <div class="card-title">🚗 AGV 状态</div>
        <div class="agv-grid" id="agvList">
            <span style="color:#546e7a;font-size:12px;">加载中...</span>
        </div>
    </div>

    <!-- ========== 板块3: 楼层加工状态 ========== -->
    <div class="card full-width">
        <div class="card-title">🏗️ 楼层加工状态 <span id="floorTitle" style="color:#4fc3f7;font-size:12px;text-transform:none;">(3F - 产生站+粗加工站)</span></div>
        <div class="floor-layout">
            <div class="floor-tabs">
                <div class="floor-tab active" data-floor="3" onclick="switchFloor(3)">3F</div>
                <div class="floor-tab" data-floor="2" onclick="switchFloor(2)">2F</div>
                <div class="floor-tab" data-floor="1" onclick="switchFloor(1)">1F</div>
            </div>
            <div class="floor-content" id="floorContent">
                <div style="color:#546e7a;font-size:12px;">加载中...</div>
            </div>
    </div>

    <!-- ========== 板块6: 任务下达 ========== -->
    <div class="card full-width">
        <div class="card-title">📋 手动任务下达</div>
        <div class="task-form">
            <div class="task-row">
                <div class="task-field">
                    <label>AGV编号</label>
                    <select id="taskAgv">
                        <option value="0">Agv-0</option>
                        <option value="1">Agv-1</option>
                        <option value="2">Agv-2</option>
                        <option value="3">Agv-3</option>
                        <option value="4">Agv-4</option>
                        <option value="5">Agv-5</option>
                        <option value="6">Agv-6</option>
                        <option value="7">Agv-7</option>
                        <option value="8">Agv-8</option>
                    </select>
                    </select>
                </div>
                <div class="task-field">
                    <label>任务类型</label>
                    <select id="taskType">
                        <option value="搬运任务">🚚 搬运任务</option>
                        <option value="缺省">🏃 空跑</option>
                    </select>
                </div>
                <div class="task-field">
                    <label>起点站</label>
                    <input type="text" id="taskSrc" value="300" placeholder="地标号">
                </div>
                <div class="task-field">
                    <label>终点站</label>
                    <input type="text" id="taskTgt" value="307" placeholder="地标号">
                </div>
                <div class="task-field">
                    <label>取货数量</label>
                    <input type="number" id="taskQty" value="3" min="1" max="5">
                </div>
                <div class="task-field task-btn-field">
                    <label>&nbsp;</label>
                    <button class="btn-send" onclick="sendTask()">▶ 下达任务</button>
                </div>
            </div>
            <div class="task-hint">
                💡 <b>搬运任务</b>：AGV到起点站取货(≤数量)→送到终点站卸货，需在<b>手动模式</b>下执行。<br>
                💡 <b>空跑</b>：AGV直接导航到终点站，不涉及货物，自动模式也可执行。
            </div>
        </div>
    </div>

</div>
    </div>

    <!-- ========== 板块4: 电梯状态 ========== -->
    <div class="card full-width">
        <div class="card-title">🛗 电梯状态</div>
        <div class="elevator-row" id="elevatorStatus">
            <div style="color:#546e7a;font-size:12px;">加载中...</div>
        </div>
    </div>

    <!-- ========== 板块5: 日志 ========== -->
    <div class="card full-width">
        <div class="card-title">📜 命令日志</div>
        <div class="log-area" id="logArea">
            <div class="log-line log-info">监控面板已就绪</div>
        </div>
    </div>

</div>

<script>
const BASE = '';
let currentMode = 'auto';
let currentFloor = 3;

function addLog(msg, cls) {
    const a = document.getElementById('logArea');
    const d = document.createElement('div'); d.className = 'log-line ' + (cls||'log-info');
    d.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
    a.appendChild(d); a.scrollTop = a.scrollHeight;
}

async function sendCmd(cmd) {
    try {
        const r = await fetch(BASE + '/manual-cmd?cmd=' + encodeURIComponent(cmd));
        const t = await r.text();
        addLog('发送: ' + cmd + ' → ' + t, t==='OK'?'log-ok':'log-warn');
        if (cmd==='manual on') { currentMode='manual'; updateModeUI(); }
        if (cmd==='manual off') { currentMode='auto'; updateModeUI(); }
    } catch(e) { addLog('失败: '+e.message, 'log-err'); }
}

function updateModeUI() {
    const ind = document.getElementById('modeIndicator');
    const on = document.getElementById('btnManualOn'), off = document.getElementById('btnManualOff');
    if (currentMode==='manual') {
        ind.textContent='手动'; ind.className='mode-indicator mode-manual';
        on.classList.add('active'); off.classList.remove('active');
    } else {
        ind.textContent='自动'; ind.className='mode-indicator mode-auto';
        off.classList.add('active'); on.classList.remove('active');
    }
}

function switchFloor(f) {
    currentFloor = f;
    document.querySelectorAll('.floor-tab').forEach(t=>t.classList.remove('active'));
    document.querySelector('.floor-tab[data-floor="'+f+'"]').classList.add('active');
    document.getElementById('floorTitle').textContent = 
        ({1:'(1F - 组装站+输出站)',2:'(2F - 精加工站)',3:'(3F - 产生站+粗加工站)'})[f];
    // 楼层切换时立即从已有的dashboard数据中渲染（不单独发请求）
}

function renderAgvList(agvs) {
    const c = document.getElementById('agvList');
    if (!agvs||!agvs.length) { c.innerHTML='<span style="color:#546e7a;grid-column:1/-1;text-align:center;">无数据</span>'; return; }
    c.innerHTML = agvs.map(a => {
        const idle = !a.status||a.status.includes('空闲')||a.status==='等待任务';
        const man = a.status&&a.status.includes('手动');
        const dot = man?'dot-manual':idle?'dot-idle':'dot-busy';
        const cls = man?'agv-manual':idle?'agv-idle':'agv-busy';
        return '<div class="agv-item '+cls+'"><span class="dot '+dot+'"></span>'+
            a.name.replace('Agv-','A')+'<br><span style="font-weight:400;font-size:10px;color:#7a9aaa;">'+(a.status||'')+'</span></div>';
    }).join('');
}

function renderFloorStations(f, stations) {
    if (f!==currentFloor) return;
    const c = document.getElementById('floorContent');
    if (!stations||!stations.length) { c.innerHTML='<div style="color:#546e7a;">暂无数据</div>'; return; }
    const g={}; stations.forEach(s=>{const t=s.type||'未知'; if(!g[t])g[t]=[]; g[t].push(s);});
    c.innerHTML = '<div class="floor-stats">'+
        Object.entries(g).map(([t,list])=> {
            const tc = t.replace(/[^\u4e00-\u9fa5a-zA-Z0-9]/g,'');
            return '<div style="width:100%;font-size:11px;color:#8bbccc;margin:4px 0 2px;">▪ '+t+' ('+list.length+'台)</div>'+
                list.map(s=>'<div class="machine-badge type-'+tc+'"><span class="label">'+s.mark+'</span><span class="qty">'+(s.leftQty||0)+'</span><span class="label">/</span><span class="qty">'+(s.rightQty||0)+'</span></div>').join('');
        }).join('')+'</div>';
}

function renderElevator(elev) {
    const c = document.getElementById('elevatorStatus');
    if (!elev) { c.innerHTML='<div style="color:#546e7a;">无数据</div>'; return; }
    function b(side,floors,cls) {
        return '<div class="elevator-box"><div class="title '+cls+'">'+side+'</div><div class="elevator-floors">'+
            floors.map(f=>'<div class="elev-floor"><span class="floor-tag">'+f.floor+'F('+f.mark+')</span><div class="floor-status">'+
                (f.hasAgv?'<span class="elev-occupied">● 有车</span><span class="elev-agv-names">'+(f.agvNames||'')+'</span>'
                :'<span class="elev-free">○ 空闲</span>')+'</div></div>').join('')+'</div></div>';
    }
    c.innerHTML = b('🄻 左电梯',elev.left||[],'left') + b('🅁 右电梯',elev.right||[],'right');
}

// ★ 手动任务下达
async function sendTask() {
    const agv = document.getElementById('taskAgv').value;
    const type = document.getElementById('taskType').value;
    const src = document.getElementById('taskSrc').value.trim();
    const tgt = document.getElementById('taskTgt').value.trim();
    const qty = parseInt(document.getElementById('taskQty').value) || 1;
    if (!src || !tgt) { addLog('请填写起点站和终点站', 'log-err'); return; }
    const cmd = 'manual-task ' + agv + ' ' + encodeURIComponent(type) + ' ' + src + ' ' + tgt + ' ' + qty;
    await sendCmd(cmd);
}

// ★ 唯一数据入口：只调用 /dashboard，一次获取全部状态 ★
async function refreshAll() {
    try {
        const r = await fetch(BASE + '/dashboard');
        if (!r.ok) throw new Error('HTTP '+r.status);
        const d = await r.json();
        if (d.error) { console.warn('[dashboard] 错误:', d.error); return; }
        
        // 同步模式
        if (d.mode==='manual' && currentMode!=='manual') { currentMode='manual'; updateModeUI(); }
        if (d.mode==='auto' && currentMode!=='auto') { currentMode='auto'; updateModeUI(); }
        
        // AGV
        renderAgvList(d.agvs);
        
        // 当前楼层（所有楼层数据一次返回，前端按当前楼层渲染）
        const stations = (d.floors && d.floors[String(currentFloor)]) || [];
        renderFloorStations(currentFloor, stations);
        
        // 电梯
        renderElevator(d.elevator);
    } catch(e) {
        console.warn('[dashboard] 刷新失败:', e.message);
    }
}

updateModeUI();
setInterval(refreshAll, 1000);
refreshAll();
</script>
</body>
</html>
